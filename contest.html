     vault. Rewritten in the app's look: what the contest is → the round's timeline → this round (one pot) → what this wallet can do

<style>
/* the app's design tokens, copied from app.html :root and its three colour variants (test-contest-truth-378 checks they stay equal) */

  --accentRgb:167 139 250; --fondRgb:15 10 23; --fond2Rgb:26 18 40; --boutonRgb:139 92 246;
  --creux:hsl(var(--h) 33% 8%);

  --accent:#7ea6ff;--accent2:hsl(222 100% 87%);--accentRgb:126 166 255;--fondRgb:6 10 24;--fond2Rgb:14 24 48;--boutonRgb:59 130 246;
  --etoileRgb:220 232 255;--carteHautRgb:26 40 78;--carteBasRgb:12 18 40;--g1:#3b82f6;--g2:#7ea6ff}
:root[data-teinte="c"]{--h:250;--fond:#070616;--fond2:#15123a;--carte:hsl(248 46% 12%);--ligne:#2a2460;--texte:#f1efff;--doux:#b8b3ee;
  --accent:#9d8cff;--accent2:hsl(300 100% 88%);--accentRgb:157 140 255;--fondRgb:7 6 22;--fond2Rgb:21 18 58;--boutonRgb:168 85 247;
  --etoileRgb:236 226 255;--carteHautRgb:44 30 92;--carteBasRgb:16 12 44;--g1:#7c5cff;--g2:#c084fc}
:root[data-teinte="d"]{--h:200;--fond:#04090c;--fond2:#0a1b22;--carte:hsl(198 48% 8%);--ligne:#16323c;--texte:#f2fbff;--doux:#9cc3cf;
  --accent:#35d3f0;--accent2:hsl(168 85% 76%);--accentRgb:53 211 240;--fondRgb:4 9 12;--fond2Rgb:10 27 34;--boutonRgb:31 91 255;
  --etoileRgb:214 244 255;--carteHautRgb:12 44 56;--carteBasRgb:6 18 24;--g1:#1f5bff;--g2:#2fe0c8}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--fond);color:var(--texte);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:64px;overflow-x:hidden}
[hidden]{display:none!important}
a{color:var(--accent)}
.enveloppe{max-width:560px;margin:0 auto;padding:0 16px}
.tete{display:flex;align-items:center;gap:10px;padding:16px 0 12px}

  color:hsl(var(--h) 60% 10%);min-height:42px;margin:10px 8px 0 0;transition:transform .12s ease,opacity .12s ease}
.bouton:active{transform:scale(.985)}

.ouvre{margin:8px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:rgb(var(--accentRgb) / .08);border-radius:0 var(--rs) var(--rs) 0;font-size:13.5px}
details.pli summary{cursor:pointer;font-weight:700;font-size:16px;letter-spacing:-.2px}

/* the contest's own parts, drawn with the tokens above only */
.etapes{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.champ input.n{flex:0 0 84px}
.champ input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.geste{margin:12px 0 0;padding:12px 14px;border:1px solid var(--ligne);border-radius:var(--rs)}
.geste>b{display:block;font-size:14px}
@media (max-width:420px){ .ligne{flex-direction:column;gap:0} .ligne>span:first-child{max-width:none} .ligne>span:last-child{text-align:left} .bouton{width:100%;margin-right:0}
  .etapes{grid-template-columns:1fr} .champ input,.champ input.n{flex:1 1 100%} }
</style>

<body>
<main class="enveloppe">
  <div class="tete">
    <a class="marque" href="/">Tokenized<span>Block</span></a>
    <div class="droite"><button class="puce" id="bWallet" type="button" data-connect="1">Connect wallet</button></div>
  </div>
  <h1>Block contest</h1>
  <p class="sous" id="intro">Creators enter a block they made, and anyone buys votes with TBLOCK. When a round ends, the contract pays its pot by fixed rules that nobody can change.</p>

  <div class="carte" id="timeline"><p class="note" style="margin:0">Reading the contest on Base…</p></div>
  <div class="carte" id="round" hidden></div>
  <div class="carte" id="me" hidden></div>
  <div class="carte" id="past" hidden></div>
  <div class="carte" id="rules" hidden></div>
  <p class="note" id="etat" role="status" aria-live="polite"></p>
  <p class="note" id="foot"></p>
  <p class="note"><a href="/">← Back to the app</a></p>
</main>

<script type="module">
import * as C from './block-contest.js';
import * as CV from './contest-vue.js';
import * as EP from './economie-pack.js';
import { displayShort, isFeeAddress } from './frais-creation.js';
import { envoyerGroupe } from './groupe-wallet.js';

/* ---------------------------------------------------------------- reads: Base public nodes, straight from the browser */
const NODES = ['https://base-rpc.publicnode.com', 'https://mainnet.base.org'];
let nodeAt = 0, reqId = 0;
async function node(method, params) {
  let last = new Error('no node answered');
  for (let k = 0; k < NODES.length; k++) {
    const at = (nodeAt + k) % NODES.length;
    try {
      const r = await fetch(NODES[at], { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: ++reqId, method, params }), signal: AbortSignal.timeout(12000) });
      const j = await r.json();
      if (j && j.result !== undefined && j.result !== null) { nodeAt = at; return j.result; }
      const msg = (j && j.error && j.error.message) || 'empty answer';
      if (/revert/i.test(msg)) { const e = new Error(msg); e.reverted = true; e.data = j.error.data; throw e; }
      last = new Error(msg);
    } catch (e) { if (e && e.reverted) throw e; last = e; }
  }
  throw last;
}
const call = (to, data) => node('eth_call', [{ to, data }, 'latest']);
const callFrom = (from, to, data) => node('eth_call', [{ from, to, data }, 'latest']);
const rd = (v) => call(v.to, v.data);

/* ---------------------------------------------------------------- words */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const row = (k, v) => '<div class="ligne"><span>' + esc(k) + '</span><span>' + v + '</span></div>';
const pill = (t, c) => '<span class="pastille ' + c + '">' + esc(t) + '</span>';
/* a fee wallet is shown by its name only: no address, no link (frais-creation.js holds that rule) */
const scan = (a) => isFeeAddress(a) ? esc(displayShort(a)) : '<a href="https://basescan.org/address/' + esc(a) + '" target="_blank" rel="noopener" title="' + esc(a) + '">' + esc(displayShort(a)) + '</a>';
const tok = (raw) => esc(C.formatUnits18(raw)) + ' TBLOCK';
const utc = (ts) => new Date(Number(ts) * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
const day = (ts) => { const d = new Date(Number(ts) * 1000); return d.toLocaleString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) + ', ' + d.toISOString().slice(11, 16) + ' UTC'; };
const pct = (bps) => (Number(bps) / 100).toString() + '%';
const span = (sec) => { const d = Number(sec) / 86400; return Number.isInteger(d) ? d + (d === 1 ? ' day' : ' days') : C.formatDuration(sec); };
/* the $ of an amount, at the pool price the app uses (/api/tblock/hold priceNow); nothing when that price was not read */
const dollars = (raw) => { const u = CV.usdOf(raw, usd); return u ? ' <span class="note">(about ' + esc(u) + ' at the pool price read just now)</span>' : ''; };

let P = null, S = null, dead = null, skew = 0, usd = null, feed = null, wallet = null, my = null, busy = false;
const symbols = new Map(), mine = { list: null, why: '' };
let mineRun = 0;
const chainNow = () => Math.floor(Date.now() / 1000) + skew;
/** the one status line under the cards: what is happening, a refusal, a confirmation */
let said = { text: '', cls: '', hash: null };
function say(text, cls = '', hash = null) { said = { text, cls, hash }; paintSaid(); }
function paintSaid() {
  const e = $('etat');
  e.className = 'note' + (said.cls ? ' ' + said.cls : '');
  e.innerHTML = esc(said.text) + (said.hash && /^0x[0-9a-fA-F]{64}$/.test(said.hash) ? ' <a href="https://basescan.org/tx/' + esc(said.hash) + '" target="_blank" rel="noopener">View on Basescan</a>' : '');
}

async function symbolOf(token, known) {
  if (known) symbols.set(token, known);
  if (symbols.has(token)) return symbols.get(token);
  let s = '';
  try { s = C.decodeString(await rd(C.VIEW.symbol(token))); } catch (_) { s = ''; }
  symbols.set(token, s);
  return s;
}
const nameOf = (token) => (symbols.get(token) ? '<b>' + esc(symbols.get(token)) + '</b> ' : '') + scan(token);

/* ---------------------------------------------------------------- one full read */
async function refresh() {
  try {
    const head = await node('eth_getBlockByNumber', ['latest', false]);
    skew = Number(BigInt(head.timestamp)) - Math.floor(Date.now() / 1000);
    if (!P) { P = await C.readParams(call); dead = C.decodeAddress(await rd(C.VIEW.param('DEAD'))); }
    S = await C.readState(call, { now: chainNow(), params: P });
    for (const e of S.current.entries) await symbolOf(e.blockToken);
    for (const r of S.past) for (const e of r.entries) await symbolOf(e.blockToken);
    try {
      const h = await fetch('/api/tblock/hold', { cache: 'no-store', signal: AbortSignal.timeout(8000) }).then((x) => x.json());
      usd = h && h.ok && Number(h.priceNow) > 0 ? Number(h.priceNow) : null;
    } catch (_) { usd = null; }
    /* the holders vault names the contest it feeds (CONTEST()): the line about it is shown only when that is THIS contest */
    feed = EP.VAULT ? await CV.readFeed(call, { vault: EP.VAULT, freeView: EP.VIEW.free() }) : null;
    if (wallet) await readWallet();
    S.readError = '';
  } catch (e) {
    if (S) S.readError = String((e && e.message) || e);
    else { $('timeline').innerHTML = '<p class="titre">Contest not read</p><p class="note">The Base nodes did not answer (' + esc(String((e && e.message) || e).slice(0, 120)) + '). Nothing is shown until the contract is read. This page retries on its own.</p>'; return; }
  }
  render();
}

async function readWallet() {
  const r = S.chainRound, w = wallet;
  if (!w) return;
  const out = { wallet: w, balance: C.decodeUint(await rd(C.VIEW.balanceOf(w))), claimable: C.decodeUint(await rd(C.VIEW.claimable(w))),
    enteredBy: C.decodeBool(await rd(C.VIEW.enteredBy(r, w))), room: C.decodeUint(await rd(C.VIEW.fundRoom(r))), allowance: C.decodeUint(await rd(C.VIEW.allowance(w))), voted: new Map() };
  for (const e of S.current.entries) out.voted.set(e.id, C.decodeBool(await rd(C.VIEW.hasVoted(r, e.id, w))));
  if (w === wallet) my = out; /* task 3 (lot 378): a late answer for a wallet that is no longer connected is dropped, never shown under another */
}

/* ---------------------------------------------------------------- the connected wallet's own blocks
 * game386: the server index (/api/blocks-de) lists them in half a second; the POOL of each is then found on the contest contract itself
 *   (contest-vue.js findBlockKey: the key a block born by this app has, creatorOf answers or reverts). /api/cle is asked only when no such
 *   key exists (a pool born another way), with its own short bound. The whole search has ONE time budget: past it, the page says so and
 *   points to the address field, it never spins. */
const MINE_BUDGET_MS = 30000, INDEX_MS = 8000, CLE_MS = 8000;
async function readMine(extra) {
  const who = wallet, run = ++mineRun;
  if (!who) return;
  const alive = () => run === mineRun && who === wallet;
  mine.list = null; mine.why = 'Looking for the blocks this wallet created…'; render();
  const deadline = Date.now() + MINE_BUDGET_MS;
  let blocks = [], indexRead = false;
  const known = {};
  try {
    const j = await CV.withTimeout(fetch('/api/blocks-de?' + new URLSearchParams({ adr: who }), { cache: 'no-store' }).then((x) => x.json()), INDEX_MS, 'the block index');
    if (j && j.ok && Array.isArray(j.blocks)) {
      indexRead = true;
      blocks = j.blocks.map((b) => String(b).toLowerCase()).filter((b) => /^0x[0-9a-f]{40}$/.test(b));
      for (const b of blocks) { const f = j.faits && j.faits[b]; if (f && typeof f.symbole === 'string' && f.symbole) known[b] = f.symbole.slice(0, 16); }
    }
  } catch (_) { /* the index is a shortcut only: the address field below still works */ }
  if (!alive()) return;
  if (extra) { blocks = blocks.filter((b) => b !== extra); blocks.unshift(extra); }
  const list = [], todo = blocks.slice(0, 12);
  let late = 0;
  for (let i = 0; i < todo.length; i++) {
    const b = todo[i];
    const item = { block: b, ok: false, why: '', key: null, entered: false };
    if (todo.length > 1) { mine.why = 'Checking block ' + (i + 1) + ' of ' + todo.length + ' on the contest contract…'; mine.list = list.slice(); render(); }
    const left = deadline - Date.now();
    if (left <= 0) { item.why = 'not checked: the time for this page ran out'; late++; list.push(item); continue; }
    try {
      await CV.withTimeout(symbolOf(b, known[b]), Math.min(left, 12000), 'the name of the block').catch(() => null);
      const f = await CV.withTimeout(CV.findBlockKey(call, { blockToken: b, wallet: who, deadline }), Math.max(500, deadline - Date.now()), 'the check of this block');
      if (f.etat === 'OK') { item.ok = true; item.key = f.key; item.entered = C.decodeBool(await rd(C.VIEW.entered(S.chainRound, b))); }
      else if (f.etat === 'NONE') await poolFromServer(item, who, deadline);
      else { item.why = f.etat === 'NOT_READ' ? 'not read just now (' + f.why + ')' : f.why; if (f.etat === 'NOT_READ') late++; }
    } catch (e) { item.why = e && e.timeout ? 'not read in time (' + e.message + ')' : 'not read just now (' + String((e && e.message) || e).slice(0, 80) + ')'; late++; }
    if (!alive()) return;
    list.push(item);
  }
  if (!alive()) return;
  mine.list = list;
  mine.why = !indexRead && !extra ? 'Could not read the blocks of this wallet just now. Paste a block address below to check it on the contest contract.'
    : late ? 'Could not read every block of this wallet in time. Paste a block address below to check it on the contest contract.'
    : blocks.length > 12 ? 'Only the first 12 blocks are checked here. Paste an address below to check another one.'
    : !blocks.length ? 'No block created by this wallet is in the index yet. An empty list means the index has not seen one, not that there is none: paste the block address below to check it on the contract.'
    : '';
  render();
}
/** a block with no pool of the shape this app creates: the server is asked for the pools it has seen (bounded), then each is checked */
async function poolFromServer(item, who, deadline) {
  const b = item.block;
  let k = null;
  try { k = await CV.withTimeout(fetch('/api/cle/' + b, { cache: 'no-store' }).then((x) => x.json()), Math.max(500, Math.min(CLE_MS, deadline - Date.now())), 'the pool index'); } catch (_) { k = null; }
  const keys = k && k.ok && Array.isArray(k.cles) ? k.cles.filter((c) => String(c.hooks).toLowerCase() === C.HOOK) : null;
  /* /api/cle: ok:false with a window (balaye) and no NON_LU = the server READ that window and found no pool (it keeps that answer):
   *   trying again cannot find an older one. Only NON_LU, or no answer at all, is a read that failed. */
  if (!keys) item.why = k && k.ok === false && k.etat !== 'NON_LU' && Number(k.balaye) > 0
    ? 'no pool of this block is recorded on the hook the contest reads, and no pool of it was found in the last ' + Number(k.balaye).toLocaleString('en-US') + ' Base blocks the server reads; trying again will not find an older one'
    : 'no pool of the shape this app creates, and the other pools of this block were not read just now; try again in a minute';
  else if (!keys.length) item.why = 'this block has no pool on the creator registry the contest reads';
  for (const c of keys || []) {
    const key = { currency0: String(c.currency0).toLowerCase(), currency1: String(c.currency1).toLowerCase(), fee: Number(c.fee), tickSpacing: Number(c.tickSpacing), hooks: String(c.hooks).toLowerCase() };
    const chk = await C.readCreatorCheck(call, { blockToken: b, key, wallet: who });
    if (chk.ok) { item.ok = true; item.key = key; item.why = ''; item.entered = C.decodeBool(await rd(C.VIEW.entered(S.chainRound, b))); break; }
    item.why = chk.why;
  }
}

/* ---------------------------------------------------------------- sending: simulated FROM the wallet, then ONE batch the user signs */
async function gesture({ calls, sim, what }) {
  if (busy || !wallet) return;
  busy = true; render();
  const who = wallet;
  try {
    say('Checking your wallet and simulating ' + what + ' from it on Base…');
    let accs = null;
    try { accs = await window.ethereum.request({ method: 'eth_accounts' }); } catch (_) { accs = null; }
    if (!accs || !accs[0] || String(accs[0]).toLowerCase() !== who) { say('Not sent: your wallet account is not the one this page read. Nothing was sent.', 'ko'); return; }
    const chain = await window.ethereum.request({ method: 'eth_chainId' });
    if (String(chain).toLowerCase() !== C.CHAIN_ID_HEX) { say('Not sent: your wallet is not on Base. Switch it to Base and try again.', 'ko'); return; }
    /* fresh reads for the simulation: the balance and the allowance the batch starts from */
    let balance = null, allowance = null;
    try { balance = C.decodeUint(await rd(C.VIEW.balanceOf(who))); allowance = C.decodeUint(await rd(C.VIEW.allowance(who))); } catch (_) { /* said by the simulation as not read */ }
    const s = await CV.simulateGesture(callFrom, { from: who, to: sim.to, data: sim.data, need: sim.need || 0n, allowance, balance });
    if (!s.ok) { say('Not sent: ' + s.why + '. Your wallet was not opened.', 'ko'); return; }
    say(s.why[0].toUpperCase() + s.why.slice(1) + '. Waiting for your wallet…');
    const res = await envoyerGroupe({ eth: window.ethereum, compte: who, chaineHex: C.CHAIN_ID_HEX, calls });
    if (res.etat === 'CONFIRME') say('Confirmed on Base: ' + what + '. The figures above are read again from the contract.', 'ok', res.hash);
    else if (res.etat === 'REFUSE') say('Not sent: you declined in your wallet. Nothing was sent.', 'ko');
    else if (res.etat === 'PARTIEL') say('Only part of it went through: ' + res.pourquoi + '.', 'ko');
    else if (res.etat === 'EN_ATTENTE') say('Sent, not confirmed after 4 minutes. Check your wallet history before trying again.', 'ko');
    else say('Not done: ' + String(res.pourquoi || res.etat).slice(0, 160) + '.', 'ko');
  } catch (e) {
    say('Not sent: ' + String((e && e.message) || e).slice(0, 160), 'ko');
  } finally {
    busy = false;
  }
  await refresh();
  if (wallet && mine.list) readMine();
}

let listening = false;
function listen() {
  if (listening || !window.ethereum || typeof window.ethereum.on !== 'function') return;
  window.ethereum.on('accountsChanged', onAccounts); listening = true;
}
function onAccounts(a) {
  const next = a && a[0] ? String(a[0]).toLowerCase() : null;
  if (next === wallet) return;
  wallet = next; my = null; mine.list = null; mine.why = ''; mineRun++; say('');
  render();
  refresh().then(() => { if (wallet) readMine(); });
}
async function connect() {
  if (!window.ethereum) { say('No wallet found in this browser.', 'ko'); return; }
  try {
    const a = await window.ethereum.request({ method: 'eth_requestAccounts' });
    wallet = a && a[0] ? String(a[0]).toLowerCase() : null;
    listen();
  } catch (e) { say('Wallet not connected: ' + String((e && e.message) || e).slice(0, 120), 'ko'); }
  if (wallet) { await refresh(); readMine(); } else render();
}

/* ---------------------------------------------------------------- render */
function render() {
  if (!S) return;
  const p = P, now = chainNow(), cur = S.current, T = CV.timeline(p, now), w = C.phaseAt(p, now);
  $('bWallet').textContent = wallet ? displayShort(wallet) : 'Connect wallet';
  const places = [p.split1, p.split2, p.split3].filter((x) => x > 0n).length;
  $('intro').innerHTML = 'Creators enter a block they made, and anyone buys votes with TBLOCK. When a round ends, the contract pays its pot to '
    + (places === 1 ? 'the creator of the most-voted block that qualifies' : 'the creators of the ' + places + ' most-voted blocks that qualify') + ', by fixed rules that nobody can change.';

  /* 1. the timeline of the round */
  let t = '<p class="titre">' + (T.phase === 'BEFORE_START' ? 'First round (round 0)' : 'Round ' + T.round) + '</p>';
  t += '<ol class="etapes">' + T.steps.map((s) => '<li class="etape" data-etat="' + (s.on ? 'on' : s.done ? 'fait' : '') + '"' + (s.on ? ' aria-current="step"' : '') + '><b>' + esc(s.label) + (s.on ? ' · now' : '') + '</b><span>'
    + (s.to === null ? 'from ' + esc(day(s.from)) + ', when anyone settles it' : esc(day(s.from)) + ' → ' + esc(day(s.to))) + '</span></li>').join('') + '</ol>';
  t += '<p class="note">' + esc(T.next.what) + '</p><div class="compte" id="cd">' + esc(C.formatDuration(T.next.secondsLeft)) + '</div>';
  t += '<p class="note">' + (T.phase === 'ENTRY' ? 'Creators can enter their block now. Votes open when entries close.' : T.phase === 'VOTE' ? 'Entries are closed. Anyone can buy votes until the round ends; a vote sent after that second is refused.' : 'Nothing can be entered or voted before the start.')
    + ' Times are read from the contract, in UTC.</p>';
  if (S.readError) t += '<p class="ouvre">The last refresh failed (' + esc(S.readError.slice(0, 100)) + '). The figures are from the previous read.</p>';
  $('timeline').innerHTML = t;

  /* 2. this round: ONE pot, the cap apart, the counts, whether it pays */
  const q = CV.quorumWords(cur, p);
  const fill = p.maxPot > 0n ? Number(cur.pot * 1000n / p.maxPot) / 10 : 0;
  let r = '<p class="titre">This round</p>';
  r += '<p class="note" style="margin:0">Pot of ' + (w.phase === 'BEFORE_START' ? 'the first round' : 'round ' + S.chainRound) + '</p><div class="pot" data-pot="1">' + tok(cur.pot) + (cur.pot > 0n ? dollars(cur.pot) : '') + '</div>';
  r += '<div class="piste" role="img" aria-label="pot at ' + fill + '% of the cap of one round"><div class="rempli" style="width:' + Math.min(100, fill) + '%"></div></div>';
  r += row('Cap per round', tok(p.maxPot) + dollars(p.maxPot));
  r += row('Filled', fill + '% of the cap');
  r += row('Blocks entered', String(cur.entryCount));
  r += row('Votes bought', String(cur.totalVotes));
  r += row('Entries that qualify', String(cur.qualifiedCount) + ' of ' + p.minQualifiedEntries + ' needed ' + (q.pays ? pill('pays', 'ok') : pill('not paying yet', 'att')));
  r += '<p class="ouvre">' + esc(q.head) + ' ' + esc(q.rule[0].toUpperCase() + q.rule.slice(1)) + '.' + (q.pays ? '' : ' ' + esc(q.ifNot)) + '</p>';
  for (const e of cur.entries) {
    r += '<div class="periode"><div class="haut"><span>' + nameOf(e.blockToken) + '</span>' + (e.qualified ? pill('qualifies', 'ok') : pill('does not qualify yet', 'att')) + '</div>'
      + row('Votes', String(e.votes) + ' (needs ' + p.minVotes + ')') + row('Different voting addresses', String(e.voters) + ' (needs ' + p.minVoters + ')') + row('Paid to, if it wins', scan(e.payee));
    if (w.phase === 'VOTE' && !S.clockMismatch) {
      if (wallet) r += '<div class="champ"><input class="n" type="number" min="1" step="1" value="1" id="v' + e.id + '" aria-label="Number of votes"><button class="bouton" type="button" data-vote="' + e.id + '">Vote</button></div><p class="note">' + tok(p.votePrice) + dollars(p.votePrice) + ' per vote, not refundable'
        + (my && my.voted.get(e.id) ? ' · this wallet already voted here' : '') + '</p>';
      else r += '<button class="bouton sec" type="button" data-connect="1">Connect a wallet to vote</button>';
    }
    r += '</div>';
  }
  if (cur.entriesNotRead > 0) r += '<p class="note">' + cur.entriesNotRead + ' more entries exist and are not listed here.</p>';
  const fw = CV.feedWords(feed);
  r += '<p class="note">' + (fw ? esc(fw) + ' ' : '') + '<a href="/claim.html">Holders vault &amp; claims →</a></p>';
  $('round').innerHTML = r; $('round').hidden = false;

  /* 3. what this wallet can do: enter, vote, add to the pot — each simulated from the wallet before the wallet opens */
  const typed = ($('fundAmt') || {}).value || ''; /* a refresh redraws the card: keep what the person was typing */
  const typedBlock = ($('manual') || {}).value || '';
  let m = '<p class="titre">For your wallet</p>';
  if (!wallet) {
    m += '<p class="sous" style="margin:0">Connect the wallet that created your block to enter it, or any wallet holding TBLOCK to vote or add to the pot. Each gesture is simulated from your wallet on Base before your wallet opens.</p><button class="bouton" type="button" data-connect="1">Connect wallet</button>';
  } else {
    m += row('Wallet', scan(wallet)) + (my ? row('TBLOCK in this wallet', tok(my.balance)) : row('TBLOCK in this wallet', 'reading…'));
    if (my && my.claimable > 0n) m += '<div class="geste"><b>A payment waiting for you</b><p class="note">The contract holds ' + tok(my.claimable) + ' for this wallet (a prize whose payment did not go through).</p><button class="bouton" type="button" data-claim="1">Claim it to this wallet</button></div>';
    /* enter my block */
    m += '<div class="geste"><b>Enter my block</b>';
    if (w.phase === 'ENTRY') m += '<p class="note">Entering costs ' + tok(p.entryFee) + dollars(p.entryFee) + '. It goes into the pot and is not refundable. One entry per wallet and per block in each round.</p>' + (my && my.enteredBy ? '<p class="note">' + pill('this wallet already has an entry in this round', 'ok') + '</p>' : '');
    else if (w.phase === 'VOTE') m += '<p class="note">Entries for this round are closed. The next ones open ' + esc(day(w.roundEndsAt)) + '.</p>';
    else m += '<p class="note">Entries open ' + esc(day(p.genesis)) + '. The blocks below are checked now so you know where you stand.</p>';
    if (mine.why) m += '<p class="note">' + esc(mine.why) + '</p>';
    for (const b of mine.list || []) {
      m += '<div class="periode"><div class="haut"><span>' + nameOf(b.block) + '</span>' + (b.ok ? pill('you are its recorded creator', 'ok') : pill('cannot be entered', 'ko')) + '</div>';
      if (!b.ok) m += '<p class="note">' + esc(b.why) + '</p>';
      else if (b.entered) m += '<p class="note">Already entered in this round.</p>';
      else if (w.phase === 'ENTRY' && !S.clockMismatch && !(my && my.enteredBy)) m += '<button class="bouton" type="button" data-enter="' + esc(b.block) + '">Enter this block for ' + tok(p.entryFee) + '</button>';
      m += '</div>';
    }
    m += '<div class="champ"><input id="manual" placeholder="Block address (0x…)" aria-label="Block address" autocomplete="off"><button class="bouton sec" type="button" data-check="1">Check this block</button></div></div>';
    /* vote */
    m += '<div class="geste"><b>Vote</b><p class="note">' + (w.phase === 'VOTE' ? 'Pick a block in the round above. One vote costs ' + tok(p.votePrice) + dollars(p.votePrice) + ' and is not refundable.'
      : 'Voting opens ' + esc(day(w.phase === 'BEFORE_START' ? p.genesis + p.entryPeriod : w.endsAt)) + '. One vote will cost ' + tok(p.votePrice) + dollars(p.votePrice) + ', not refundable; the blocks entered will each have a Vote button above.') + '</p></div>';
    /* add to the pot */
    m += '<div class="geste"><b>Add TBLOCK to the pot</b><p class="note">Anyone can add to the pot of this round. Nobody can take it back, you included; the contract pays it by the rules below.</p>';
    if (!my) m += '<p class="note">Reading this wallet…</p>';
    else if (S.clockMismatch) m += '<p class="note">The clock of this device and the chain disagree on the round; the field comes back when they agree.</p>';
    else {
      m += row('Room left under the cap', tok(my.room));
      if (my.room > 0n) {
        const most = my.balance < my.room ? my.balance : my.room;
        m += '<div class="champ"><input id="fundAmt" inputmode="decimal" placeholder="TBLOCK amount" aria-label="TBLOCK amount to add">'
          + (most > 0n ? '<button class="bouton sec" type="button" data-max="' + esc(C.formatUnits18(most, 18).replace(/,/g, '')) + '">Max</button>' : '') + '<button class="bouton" type="button" data-fund="1">Add to the pot</button></div>';
      }
    }
    m += '</div>';
  }
  $('me').innerHTML = m; $('me').hidden = false;
  if (typed && $('fundAmt')) $('fundAmt').value = typed;
  if (typedBlock && $('manual')) $('manual').value = typedBlock;

  /* 4. past rounds */
  if (S.past.length) {
    let h = '<p class="titre">Past rounds</p>';
    for (const pr of S.past) {
      const o = pr.outcome, win = o.winner && !o.winner.notRead ? nameOf(o.winner.blockToken) + ' (paid to ' + scan(o.winner.payee) + ')' : 'entry ' + (o.winner ? o.winner.id : '');
      const txt = o.state === 'PAID' ? 'Settled. Winner: ' + win : o.state === 'TO_PAY' ? 'Ended, not settled yet. Leading: ' + win + '. Pot: ' + tok(pr.pot)
        : o.state === 'NO_WINNER' ? 'Settled with no winner: ' + pr.qualifiedCount + ' of the ' + p.minQualifiedEntries + ' qualifying entries needed. Its pot was carried forward.'
        : 'Ended, not settled yet: ' + pr.qualifiedCount + ' of the ' + p.minQualifiedEntries + ' qualifying entries needed, so nobody will be paid and its pot (' + tok(pr.pot) + ') is carried forward.';
      h += '<div class="periode"><div class="haut"><b>Round ' + pr.round + '</b><span class="note" style="margin:0">' + pr.entryCount + ' entries · ' + pr.totalVotes + ' votes</span></div><p>' + txt + '</p>';
      if (!pr.settled) h += wallet ? '<button class="bouton sec" type="button" data-settle="' + pr.round + '">Settle round ' + pr.round + '</button><p class="note">Anyone can do this. It costs network fees only.</p>' : '<button class="bouton sec" type="button" data-connect="1">Connect a wallet to settle it</button>';
      h += '</div>';
    }
    $('past').innerHTML = h; $('past').hidden = false;
  } else $('past').hidden = true;

  /* 5. the rules, written from the values read, folded */
  const toPot = C.BPS - p.burnBps, placesTxt = [['First', p.split1], ['second', p.split2], ['third', p.split3]].filter((x) => x[1] > 0n);
  const wasOpen = !!document.querySelector('#rules details[open]');
  let u = '<details class="pli"' + (wasOpen ? ' open' : '') + '><summary>Rules, as the contract applies them</summary><ol>';
  u += '<li><b>Who can enter.</b> Only the wallet recorded as the creator of a block in the TokenizedBlock creator registry. One entry per block and one entry per wallet in each round.</li>';
  u += '<li><b>Entering.</b> ' + (p.entryFee > 0n ? 'Costs ' + tok(p.entryFee) + ', added to the pot of that round. Not refundable.' : 'Free.') + '</li>';
  u += '<li><b>Rounds.</b> A round lasts ' + esc(span(C.roundLength(p))) + ': ' + esc(span(p.entryPeriod)) + ' to enter, then ' + esc(span(p.votePeriod)) + ' to vote. The next round starts the second the previous one ends.</li>';
  u += '<li><b>Voting.</b> Anyone can vote, as many votes as they pay for. One vote costs ' + tok(p.votePrice) + '. ' + pct(p.burnBps) + ' of what you pay is sent to the dead address ' + scan(dead) + ', which nobody controls'
    + (toPot > 0n ? '; the other ' + pct(toPot) + ' goes to the pot' : '; none of it goes to the pot') + '. <b>Votes are not refundable</b>, whether the block wins or not.</li>';
  u += '<li><b>Rank.</b> More votes means a higher rank, so a first place can be bought. On equal votes, the block entered first is ahead.</li>';
  u += '<li><b>Qualifying.</b> An entry qualifies with at least ' + p.minVotes + ' votes coming from at least ' + p.minVoters + ' different addresses. The contract counts addresses, not people.</li>';
  u += '<li><b>When a round pays.</b> Only if at least ' + p.minQualifiedEntries + ' entries qualify. If not, nobody is paid: the pot is carried to the rounds that follow, each filled up to its cap, and what fits in none of the next ' + p.maxFundAhead + ' rounds is sent to the dead address.</li>';
  u += '<li><b>What is paid.</b> ' + placesTxt.map((x) => x[0] + ' place: ' + pct(x[1]) + ' of the pot').join(', ') + '. A pot never exceeds ' + tok(p.maxPot) + '. The pot is what was added to the round plus its entry fees. Nobody is obliged to add; a pot can hold 0.</li>';
  u += '<li><b>Paying.</b> After a round ends, anyone can ask the contract to settle it. The contract then pays the recorded creator wallet by the rules above. No account can withdraw a pot or change these numbers.</li>';
  u += '</ol><p class="note">TBLOCK spent on votes or on an entry is gone. This page promises no gain. Contract: ' + scan(C.CONTEST) + '.</p></details>';
  $('rules').innerHTML = u; $('rules').hidden = false;

  $('foot').innerHTML = 'Read at ' + esc(utc(chainNow())) + ' (Base clock). Reserved by the contract for pots and unpaid amounts: ' + tok(S.liabilities) + '.'
    + (S.clockMismatch ? ' The clock of this device and the chain disagree on the current round; buttons are hidden until they agree.' : '');
  paintSaid();
}

/* ---------------------------------------------------------------- clicks */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button');
  if (!t || busy) return;
  const d = t.dataset;
  if (d.connect) return connect();
  if (!S || !wallet) return;
  if (d.vote !== undefined) {
    const id = Number(d.vote), n = Number(($('v' + id) || {}).value);
    if (!Number.isInteger(n) || n < 1 || n > 1000000) return say('Enter a whole number of votes, 1 or more.', 'ko');
    const cost = C.voteCost(BigInt(n), P.votePrice);
    const calls = C.voteBatch({ round: S.chainRound, entryId: BigInt(id), votes: BigInt(n), votePrice: P.votePrice });
    return gesture({ calls, sim: { ...calls[1], need: cost }, what: n + ' vote(s) for ' + C.formatUnits18(cost) + ' TBLOCK, not refundable' });
  }
  if (d.enter) {
    const b = (mine.list || []).find((x) => x.block === d.enter && x.ok);
    if (!b) return;
    const calls = C.enterBatch({ blockToken: b.block, key: b.key, entryFee: P.entryFee });
    return gesture({ calls, sim: { ...calls[calls.length - 1], need: P.entryFee }, what: 'the entry of your block for ' + C.formatUnits18(P.entryFee) + ' TBLOCK, not refundable' });
  }
  if (d.max) { const i = $('fundAmt'); if (i) i.value = d.max; return; }
  if (d.fund) {
    if (!my) return;
    const plan = C.fundPlan({ text: ($('fundAmt') || {}).value, room: my.room, balance: my.balance });
    if (!plan.ok) return say(plan.why, 'ko');
    const calls = C.fundBatch({ round: S.chainRound, amount: plan.amount, room: my.room });
    return gesture({ calls, sim: { ...calls[1], need: plan.amount }, what: 'adding ' + C.formatUnits18(plan.amount) + ' TBLOCK to the pot of round ' + S.chainRound
      + (plan.clipped ? ' (cut to the room left under the cap)' : '') + ', not refundable' });
  }
  if (d.settle !== undefined) { const c = C.buildSettle(BigInt(d.settle)); return gesture({ calls: [c], sim: c, what: 'settling round ' + d.settle }); }
  if (d.claim) { const c = C.buildClaim(wallet); return gesture({ calls: [c], sim: c, what: 'the claim to this wallet' }); }
  if (d.check) {
    const a = String(($('manual') || {}).value || '').trim().toLowerCase();
    if (!/^0x[0-9a-f]{40}$/.test(a)) return say('That is not a full block address.', 'ko');
    say(''); return readMine(a);
  }
});

setInterval(() => {
  if (!S || busy) return;
  const el = $('cd');
  const w = C.phaseAt(P, chainNow());
  if (w.phase !== S.when.phase || w.round !== S.when.round) { S.when = w; refresh(); return; }
  if (el) el.textContent = C.formatDuration(CV.timeline(P, chainNow()).next.secondsLeft);
}, 1000);
setInterval(() => { if (!busy && !document.hidden) refresh(); }, 45000);
/* a wallet already connected to this site is picked up without a prompt (eth_accounts); otherwise the page reads without one */
(async () => {
  let a = null;
  if (window.ethereum) { try { a = await window.ethereum.request({ method: 'eth_accounts' }); } catch (_) { a = null; } listen(); }
  wallet = a && a[0] ? String(a[0]).toLowerCase() : null;
  await refresh();
  if (wallet) readMine();
})();
</script>
</body>
</html>
